version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-updates:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/apps/back.js"
    schedule:
      interval: "weekly"
    groups:
      all-updates:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/apps/back"
    schedule:
      interval: "weekly"
    groups:
      all-updates:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/apps/front"
    schedule:
      interval: "weekly"
    groups:
      all-updates:
        patterns:
          - "*"
    ignore:
      # The Next 16 lint/build stack is not ready for these majors yet:
      # Next and typescript-eslint reject the TypeScript 7 compiler API, and
      # eslint-plugin-react caps out at ESLint 9. Drop these once upstream
      # catches up.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "gomod"
    directory: "/apps/hlsx"
    schedule:
      interval: "weekly"
    groups:
      all-updates:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/apps/mobapp"
    schedule:
      interval: "weekly"
    groups:
      all-updates:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/apps/smarttv"
    schedule:
      interval: "weekly"
    groups:
      all-updates:
        patterns:
          - "*"
